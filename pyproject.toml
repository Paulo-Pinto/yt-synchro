[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-synchro"
version = "0.1.0"
description = "YouTube playlist sync with storage management"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2024.1.0",
    "rich>=13.0",
    "click>=8.1",
]

[project.scripts]
yt-synchro = "yt_synchro.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 96
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 96
skip = [".venv", "build", "dist", ".git"]
skip_glob = ["*.egg-info", "__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
